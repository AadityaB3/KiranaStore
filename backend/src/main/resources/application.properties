# Smart Kirana - Application Properties

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# Primary Database Connection - PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_kirana}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configurations
security.jwt.secret-key=${JWT_SECRET:8f2a584370db0a75dcb0e76fb2137cd5359a35cc2357ef354ca790a16cc1c9b6f849c719e7a68e31a18bc009be8b1ffadfa3514b8db474c3d3a0e6983082bbfb}
# 8 hours token expiry (8 * 60 * 60 * 1000)
security.jwt.expiration-time=28800000

# File Upload Sizes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Swagger/OpenAPI Swagger UI Path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging Settings
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
